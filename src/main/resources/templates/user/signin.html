<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>로그인</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="w-50 h-75 text-center">
        <h1 class="title mb-5">Shopping Mall</h1>
        <div class="d-flex flex-column justify-content-center align-items-center">
            <form class="w-75" th:action="@{/users/signin}" method="post">
                <div th:if="${param.error}" class="alert alert-danger">
                    아이디 또는 비밀번호가 올바르지 않습니다.
                </div>

                <div>
                    <label class="form-label text-start w-100" for="username">아이디</label>
                    <input class="form-control" type="text" id="username" name="username">
                </div>

                <div class="mb-3">
                    <label class="form-label text-start w-100" for="password">비밀번호</label>
                    <input class="form-control" type="password" id="password" name="password">
                </div>

                <button class="btn btn-success" type="submit">로그인</button>
            </form>
        </div>
    </div>
</div>
</body>
</html>
