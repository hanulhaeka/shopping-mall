<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>회원 가입</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div class="d-flex justify-content-center align-items-center vh-100">
    <div class="w-50 h-75 text-center">
        <h1 class="title mb-5">Shopping Mall</h1>
        <div class="d-flex flex-column justify-content-center align-items-center">
            <form class="w-75" th:action="@{/users/signup}" th:object="${signupDto}" method="post">
                <div class="mb-3">
                    <label class="form-label text-start w-100 mb-1" for="loginId">아이디 (필수)</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('loginId')}? 'is-invalid'" type="text" id="loginId" th:field="*{loginId}">
                    <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('loginId')}" th:errors="*{loginId}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-start w-100 mb-1" for="password">비밀번호 (필수)</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('password')}? 'is-invalid'" type="password" id="password" th:field="*{password}">
                    <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('password')}" th:errors="*{password}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-start w-100 mb-1" for="confirmPassword">비밀번호 확인 (필수)</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('confirmPassword')}? 'is-invalid'" type="password" id="confirmPassword" th:field="*{confirmPassword}">
                    <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('confirmPassword')}" th:errors="*{confirmPassword}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-start w-100 mb-1" for="name">이름 (필수)</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('name')}? 'is-invalid'" type="text" id="name" th:field="*{name}">
                    <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
                </div>

                <div class="mb-3">
                    <label class="form-label text-start w-100 mb-1" for="phoneNumber">휴대폰 번호 (선택)</label>
                    <input class="form-control" th:classappend="${#fields.hasErrors('phoneNumber')}? 'is-invalid'" type="text" id="phoneNumber" th:field="*{phoneNumber}">
                    <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('phoneNumber')}" th:errors="*{phoneNumber}"></div>
                </div>

                <button class="btn btn-success" type="submit">회원 가입</button>
            </form>
        </div>
    </div>
</div>

</body>
</html>
