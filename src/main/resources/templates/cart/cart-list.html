<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>장바구니 목록</title>
    <meta name="_csrf" th:content="${_csrf?.token}"/>
    <meta name="_csrf_header" th:content="${_csrf?.headerName}"/>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<h1 class="title text-center mb-3 mt-5">Shopping Mall</h1>

<div class="d-flex justify-content-between border-bottom border-3 pb-2 mb-3">
    <div class="ms-5">
        <a class="text-decoration-none text-reset me-3" href="/carts">장바구니</a>
        <a class="text-decoration-none text-reset" href="/orders">주문 내역</a>
    </div>
    <form class="me-5" th:action="@{/users/logout}" method="post">
        <button class="btn border-0 bg-transparent p-0" type="submit">로그아웃</button>
    </form>
</div>

<div class="d-flex flex-column justify-content-center align-items-center" th:with="totalOrderPrice=${#aggregates.sum(cartList.![totalPrice])}">

    <div class="w-50">
        <h2>장바구니</h2>
        <hr class="border-1 border-dark opacity-100">
    </div>

    <div th:each="cartItem : ${cartList}" class="w-50 cart-item-row" th:data-cart-id="${cartItem.cartItemId}" th:data-unit-price="${cartItem.unitPrice}">

        <div class="row align-items-center text-center g-2">

            <div class="col d-flex justify-content-center align-items-center">
                <img th:src="${cartItem.productImageUrl}" class="object-fit-cover w-100" style="height: 150px; max-width: 150px;">
            </div>

            <div class="col d-flex flex-column justify-content-center align-items-center">
                <h5 th:text="${cartItem.productName}" class="mb-2 fw-bold text-truncate w-100">상품명</h5>
                <p th:text="${#numbers.formatInteger(cartItem.unitPrice, 3, 'COMMA')} + '원'" class="mb-0 fw-semibold text-black-50">0원</p>
            </div>

            <div class="col d-flex justify-content-center align-items-center">
                <button type="button" class="btn btn-sm bg-transparent border-0 px-2 fw-bold btn-decrease">-</button>
                <input type="text" th:value="${cartItem.quantity}" min="1" readonly class="form-control-plaintext form-control-sm text-center fw-semibold mx-1 item-quantity-input" style="width: 35px;">
                <button type="button" class="btn btn-sm bg-transparent border-0 px-2 fw-bold btn-increase">+</button>
            </div>

            <div class="col d-flex flex-column justify-content-center align-items-center">
                <h5 class="mb-2 fw-bold text-truncate w-100">총 금액</h5>
                <p th:text="${#numbers.formatInteger(cartItem.totalPrice, 3, 'COMMA')} + '원'" class="mb-0 fw-semibold text-black-50 item-total-price">0원</p>
            </div>

            <div class="col d-flex justify-content-center align-items-center">
                <form th:action="@{/carts/{cartItemId}/delete(cartItemId=${cartItem.cartItemId})}" method="post" class="mb-0">
                    <button type="submit" class="btn btn-sm btn-outline-danger">삭제</button>
                </form>
            </div>
        </div>

        <hr class="border-1 border-dark opacity-50 w-100 my-3">

    </div>

    <div class="d-flex flex-column justify-content-center align-items-center">
        <h4 class="mb-3 total-order-price-display" th:text="|총 주문 금액 : ${#numbers.formatInteger(totalOrderPrice ?: 0, 1, 'COMMA')}원|">총 주문 금액 : 0원</h4>
        <a href="/orders/create/cart" class="btn btn-primary btn-lg fw-semibold px-5 py-2 shadow-sm mb-3">
            주문하기
        </a>
    </div>
</div>
<script th:src="@{/js/cart.js}"></script>
<script th:inline="javascript">
    const errorMessage = /*[[${errorMessage}]]*/ null;
    if (errorMessage) {
        alert(errorMessage);
    }
</script>
</body>
</html>
