<!doctype html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
  <head>
    <meta charset="UTF-8" />
    <title>주문 요청</title>
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
      crossorigin="anonymous"
    />
    <script src="//t1.daumcdn.net/mapjsapi/bundle/postcode/prod/postcode.v2.js"></script>
  </head>
  <body>
  <h1 class="title text-center mb-3 mt-5">Shopping Mall</h1>

  <div class="d-flex justify-content-between border-bottom border-3 pb-2 mb-3">
    <div class="ms-5">
      <a class="text-decoration-none text-reset me-3" href="/carts">장바구니</a>
      <a class="text-decoration-none text-reset" href="/orders">주문 내역</a>
    </div>
    <form class="me-5" th:action="@{/users/logout}" method="post">
      <button class="btn border-0 bg-transparent p-0" type="submit">
        로그아웃
      </button>
    </form>
  </div>

  <div class="d-flex flex-column justify-content-center align-items-center">
    <div class="w-50">
      <h2>주문</h2>
      <hr class="border-1 border-dark opacity-100"/>
    </div>

    <form class="w-50 d-flex flex-column justify-content-center align-items-center" th:action="@{/orders/create}" th:object="${orderCreateDto}" method="post">
      <h4 class="w-100 text-start">주문자 정보</h4>
      <input class="form-control-plaintext fw-semibold my-0 py-0" type="text" th:field="*{ordererName}" readonly/>
      <input class="form-control-plaintext my-0 py-0" type="text" th:if="*{ordererPhoneNumber}" th:field="*{ordererPhoneNumber}" readonly/>
      <hr class="my-3 w-100"/>

      <h4 class="w-100 text-start mb-4">배송 정보</h4>
      <div class="d-flex flex-column align-items-start w-100">
        <label class="form-label">이름</label>
        <input type="text" th:field="*{recipientName}" class="form-control mb-2" th:classappend="${#fields.hasErrors('recipientName')}? 'is-invalid'"/>
        <div class="text-start invalid-feedback" th:errors="*{recipientName}"></div>

        <label class="form-label">전화번호 (ex. 010-1234-5678)</label>
        <input type="text" th:field="*{recipientPhoneNumber}" class="form-control mb-2" th:classappend="${#fields.hasErrors('recipientPhoneNumber')}? 'is-invalid'"/>
        <div class="text-start invalid-feedback" th:errors="*{recipientPhoneNumber}"></div>

        <label class="form-label">주소</label>
        <input type="text" th:field="*{address}" class="form-control mb-2" th:classappend="${#fields.hasErrors('address')}? 'is-invalid'"/>
        <div class="text-start invalid-feedback" th:errors="*{address}"></div>

        <label class="form-label">상세 주소</label>
        <input type="text" th:field="*{addressDetail}" class="form-control mb-2" th:classappend="${#fields.hasErrors('addressDetail')}? 'is-invalid'"/>
        <div class="text-start invalid-feedback" th:errors="*{addressDetail}"></div>

        <label class="form-label">우편 번호</label>
        <input type="text" th:field="*{postalCode}" class="form-control mb-2" th:classappend="${#fields.hasErrors('postalCode')}? 'is-invalid'"/>
        <div class="text-start invalid-feedback" th:errors="*{postalCode}"></div>

        <butoon type="button" class="btn btn-outline-primary ms-auto mt-2" onclick="execDaumPostcode()">주소 입력</butoon>
      </div>
      <hr class="my-3 w-100"/>

      <div class="d-flex justify-content-between align-items-center w-100">
        <h4 class="text-start">주문 상품</h4>
        <p th:text="|총 ${orderCreateDto.orderList.size()}건|" class="me-3"></p>
      </div>

      <div th:each="item, stat : *{orderList}" class="w-100">
        <hr class="my-2 w-100" style="border: 0; border-top: 1px dashed #495057"/>

        <input type="hidden" th:field="*{orderList[__${stat.index}__].productId}"/>

        <div class="d-flex justify-content-between align-items-center mx-3">
          <div class="d-flex justify-content-around">
            <img th:src="${item.imageHeadUrl}" class="object-fit-cover w-100" style="height: 150px; max-width: 150px"/>
            <input type="hidden" th:field="*{orderList[__${stat.index}__].imageHeadUrl}"/>

            <div class="d-flex flex-column justify-content-center align-items-center ms-2 text-center">
              <h5 th:text="${item.productName}" class="mb-2 fw-bold text-truncate w-100">
                상품명
              </h5>
              <input type="hidden" th:field="*{orderList[__${stat.index}__].productName}"/>
              <input type="text" th:value="'수량: ' + ${item.quantity} + '개'" class="form-control-plaintext text-center" readonly/>
              <input type="hidden" th:field="*{orderList[__${stat.index}__].quantity}"/>
              <p th:text="${#numbers.formatInteger(item.unitPrice, 3, 'COMMA')} + '원'" class="mb-0 fw-semibold text-black-50">
                0원
              </p>
              <input type="hidden" th:field="*{orderList[__${stat.index}__].unitPrice}"/>
            </div>
          </div>

          <div>
            <p th:text="'총 금액: ' + ${#numbers.formatInteger(item.quantity * item.unitPrice, 3, 'COMMA')} + '원'" class="mb-0 fw-semibold text-black-50">
              0원
            </p>
          </div>
        </div>
      </div>

      <hr class="my-3 w-100"/>

      <div class="d-flex flex-column w-100 justify-content-center align-items-center">
        <h5 th:text="'총 주문 금액: ' + ${#numbers.formatInteger(orderCreateDto.totalPrice, 3, 'COMMA')} + '원'">
          0원
        </h5>
        <input type="hidden" th:field="*{totalPrice}"/>
        <button type="submit" th:text="주문" class="btn btn-outline-primary btn-lg my-3 w-25"></button>
      </div>

      <input type="hidden" th:field="*{isCartOrder}">
    </form>
  </div>

    <script th:inline="javascript">
      const errors = /*[[${globalErrors}]]*/ [];

      if (errors.length > 0) {
        alert(errors.join("\n"));
      }

      function execDaumPostcode() {
        new daum.Postcode({
          oncomplete: function (data) {
            var addr = "";
            if (data.userSelectedType === "R") {
              addr = data.roadAddress;
            } else {
              addr = data.jibunAddress;
            }
            document.getElementById("postalCode").value = data.zonecode;
            document.getElementById("address").value = addr;
            document.getElementById("addressDetail").focus();
          },
        }).open();
      }
    </script>
  </body>
</html>
