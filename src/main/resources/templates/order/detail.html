<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 상세</title>
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
</head>
<body>
<h1 class="title text-center mb-3 mt-5">Shopping Mall</h1>

<div class="d-flex justify-content-between border-bottom border-3 pb-2 mb-3">
    <div class="ms-5">
        <a class="text-decoration-none text-reset me-3" href="/carts">장바구니</a>
        <a class="text-decoration-none text-reset" href="/orders">주문 내역</a>
    </div>
    <form class="me-5" th:action="@{/users/logout}" method="post">
        <button class="btn border-0 bg-transparent p-0" type="submit">
            로그아웃
        </button>
    </form>
</div>

<div class="d-flex flex-column justify-content-center align-items-center mb-5">
    <div class="w-50">
        <h2>주문 상세</h2>
        <hr class="border-1 border-dark opacity-100"/>
    </div>

    <div class="w-50">
        <h4 class="mb-3">주문 기본 정보</h4>

        <div class="d-flex justify-content-between mx-2">
            <h6>주문자 정보</h6>
            <div class="d-flex">
                <p th:text="${orderDetailDto.ordererName}" class="me-3">이름</p>
                <p th:text="${orderDetailDto.ordererPhoneNumber}">전화번호</p>
            </div>
        </div>

        <div class="d-flex justify-content-between mx-2">
            <h6>총 결제 금액</h6>
            <p th:text="${#numbers.formatInteger(orderDetailDto.totalPrice, 3, 'COMMA')} + '원'">0원</p>
        </div>

        <div class="d-flex justify-content-between mx-2">
            <h6>주문 일시</h6>
            <p th:text="${#temporals.format(orderDetailDto.orderDateTime, 'yyyy-MM-dd HH:mm')}">2000-01-01 12:30</p>
        </div>

        <hr class="my-2 w-100" style="border: 0; border-top: 1px solid #495057"/>
    </div>

    <div class="w-50">
        <h4 class="my-3">배송 정보</h4>

        <div class="d-flex justify-content-between mx-2">
            <h6>주소</h6>
            <p th:text="${orderDetailDto.address} + ' ' + ${orderDetailDto.addressDetail} + ' (' + ${orderDetailDto.postalCode} + ')' ">주소</p>
        </div>

        <div class="d-flex justify-content-between mx-2">
            <h6>받는 사람</h6>
            <div class="d-flex">
                <p th:text="${orderDetailDto.recipientName}" class="me-3">이름</p>
                <p th:text="${orderDetailDto.recipientPhoneNumber}">전화번호</p>
            </div>
        </div>

        <hr class="my-2 w-100" style="border: 0; border-top: 1px solid #495057"/>
    </div>

    <div class="w-50">
        <div class="d-flex align-item-center justify-content-between mt-3">
            <h4 class="mb-3">주문 상품 정보</h4>
            <p th:text="'총 ' + ${#lists.size(orderDetailDto.orderItemDtos)} + '건'"></p>
        </div>

        <hr class="my-2 w-100" style="border: 0; border-top: 1px dashed #495057"/>

        <div th:each="orderItem : ${orderDetailDto.orderItemDtos}">
            <div class="d-flex justify-content-between align-items-center mx-4">
                <div class="d-flex align-items-center">
                    <img th:src="${orderItem.productImageUrl}" class="card-img-top object-fit-cover" alt="상품 이미지" style="height: 150px; max-width: 150px"/>

                    <div class="d-flex flex-column ms-5">
                        <p th:text="${orderItem.productName}" class="mb-1 fs-5 fw-semibold">상품명</p>
                        <p th:text="${#numbers.formatInteger(orderItem.unitPrice, 3, 'COMMA')} + '원'" class="mb-1">0원</p>
                        <p th:text="'수량: ' + ${orderItem.quantity} + '개'">수량: 0</p>
                    </div>
                </div>

                <p th:text="'총 금액: ' + ${#numbers.formatInteger(orderItem.unitPrice * orderItem.quantity, 3, 'COMMA')} + '원'" class="fw-semibold">총 금액: 0원</p>
            </div>

            <hr class="my-2 w-100" style="border: 0; border-top: 1px dashed #495057"/>
        </div>

    </div>
</div>

</body>
</html>
