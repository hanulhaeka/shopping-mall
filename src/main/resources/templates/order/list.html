<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>주문 목록</title>
    <meta name="_csrf" th:content="${_csrf?.token}" />
    <meta name="_csrf_header" th:content="${_csrf?.headerName}" />
    <link
            href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
            rel="stylesheet"
            integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB"
            crossorigin="anonymous"
    />
</head>
<body>
<h1 class="title text-center mb-3 mt-5">Shopping Mall</h1>

<div class="d-flex justify-content-between border-bottom border-3 pb-2 mb-3">
    <div class="ms-5">
        <a class="text-decoration-none text-reset me-3" href="/carts">장바구니</a>
        <a class="text-decoration-none text-reset" href="/orders">주문 내역</a>
    </div>
    <form class="me-5" th:action="@{/users/logout}" method="post">
        <button class="btn border-0 bg-transparent p-0" type="submit">
            로그아웃
        </button>
    </form>
</div>

<div class="d-flex flex-column justify-content-center align-items-center">
    <div class="w-50">
        <h2>주문 내역</h2>
        <hr class="border-1 border-dark opacity-100"/>
    </div>

    <div class="w-50">
        <div th:each="order : ${page.content}">
            <div class="d-flex justify-content-between align-items-center mx-5">
                <img th:src="${order.mainProductImageUrl}" class="card-img-top object-fit-cover" alt="상품 이미지" style="height: 150px; max-width: 150px"/>

                <div class="d-flex flex-column">
                    <div class="d-flex align-items-center">
                        <h5 th:text="${order.mainProductName}">대표상품명</h5>
                        <span th:if="${order.productCount gt 1}" th:text="|포함 ${order.productCount}건|" class="text-secondary" style="font-size: 0.7rem;"></span>
                    </div>

                    <h6 th:text="'총 금액: ' + ${#numbers.formatInteger(order.totalPrice, 3, 'COMMA')} + '원'">0원</h6>
                </div>

                <span th:text="${#temporals.format(order.orderTime, 'yyyy-MM-dd')}" class="text-secondary small"></span>

                <div>
                    <a class="text-decoration-none text-reset" th:href="@{/orders/{id}(id=${order.orderId})}">주문 상세</a>
                </div>
            </div>

            <hr class="my-2 w-100" style="border: 0; border-top: 1px dashed #495057"/>
        </div>
    </div>

    <div th:if="${!page.isEmpty()}" class="d-flex justify-content-center mt-4"
         th:with="
        startNumber=${(page.number / 5) * 5 + 1},
        endNumber=${(startNumber + 4 < page.totalPages) ? startNumber + 4 : page.totalPages}
     ">

        <nav aria-label="Page navigation">
            <ul class="pagination">

                <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                    <a class="page-link" th:href="@{/orders(page=0)}" aria-label="First">
                        <span aria-hidden="true">&laquo;&laquo;</span>
                    </a>
                </li>

                <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                    <a class="page-link" th:href="@{/orders(page=${page.number - 1})}" aria-label="Previous">
                        <span aria-hidden="true">&laquo;</span>
                    </a>
                </li>

                <li class="page-item"
                    th:each="pageNo : ${#numbers.sequence(startNumber, endNumber)}"
                    th:classappend="${pageNo - 1 == page.number} ? 'active'">
                    <a class="page-link"
                       th:href="@{/orders(page=${pageNo - 1})}"
                       th:text="${pageNo}">1</a>
                </li>

                <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                    <a class="page-link" th:href="@{/orders(page=${page.number + 1})}" aria-label="Next">
                        <span aria-hidden="true">&raquo;</span>
                    </a>
                </li>

                <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                    <a class="page-link" th:href="@{/orders(page=${page.totalPages - 1})}" aria-label="Last">
                        <span aria-hidden="true">&raquo;&raquo;</span>
                    </a>
                </li>

            </ul>
        </nav>
    </div>

</div>
</body>
</html>
