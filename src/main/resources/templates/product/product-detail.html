<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 상세</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <meta name="_csrf" th:content="${_csrf.token}"/>
    <meta name="_csrf_header" th:content="${_csrf.headerName}"/>
</head>
<body>
<h1 class="title text-center mb-3 mt-5">Shopping Mall</h1>

<div sec:authorize="isAnonymous()" class="d-flex justify-content-end border-bottom border-3 pb-2 mb-3">
    <a class="text-decoration-none text-reset me-3" href="/users/signin">로그인</a>
    <a class="text-decoration-none text-reset me-5" href="/users/signup">회원 가입</a>
</div>

<div sec:authorize="isAuthenticated()" class="d-flex justify-content-between border-bottom border-3 pb-2 mb-3">
    <div class="ms-5">
        <a class="text-decoration-none text-reset me-3" href="/carts">장바구니</a>
        <a class="text-decoration-none text-reset" href="/orders">주문 내역</a>
    </div>
    <form class="me-5" th:action="@{/users/logout}" method="post">
        <button class="btn border-0 bg-transparent p-0" type="submit">로그아웃</button>
    </form>
</div>

<div class="d-flex justify-content-evenly border-bottom border-3 pb-5 mb-3" th:object="${productDetailDto}">
    <img th:src="*{imageHeadUrl}" style="height: 400px;">

    <div class="d-flex flex-column justify-content-center" style="min-width: 350px;">
        <h3 class="text-end" th:text="*{name}">상품명</h3>
        <p class="fw-bold text-end mb-5" th:text="${#numbers.formatInteger(productDetailDto.price, 3, 'COMMA')} + '원'">0원</p>
        <form th:action="@{/orders/create/direct}" class="d-flex flex-column w-100" method="GET">

            <input type="hidden" name="productId" th:value="${productDetailDto.id}">

            <div class="mb-3 d-flex align-items-center justify-content-end quantity-wrapper">
                <button type="button" class="me-2 btn btn-link text-decoration-none p-0 text-dark fw-bold fs-5">-</button>
                <input id="quantity" type="text" name="quantity" value="1" min="1" class="me-2 border-0 bg-transparent p-0 text-center" style="width: 30px; -moz-appearance: textfield;" readonly>
                <button type="button" class="btn btn-link text-decoration-none p-0 text-dark fw-bold fs-5">+</button>
            </div>

            <div class="d-flex gap-2 w-100" style="max-width: 500px;">
                <button type="button" th:onclick="|addCart('*{id}')|" class="btn btn-light border w-50 fw-semibold rounded-pill text-nowrap flex-shrink-0">
                    장바구니 담기
                </button>
                <button type="submit" class="btn btn-dark w-50 fw-semibold rounded-pill text-nowrap flex-shrink-0">
                    주문하기
                </button>
            </div>
        </form>
    </div>
</div>

<img class="img-fluid d-block mx-auto" th:src="${productDetailDto.image1Url}">
<img class="img-fluid d-block mx-auto" th:src="${productDetailDto.image2Url}">
<img class="img-fluid d-block mx-auto" th:src="${productDetailDto.image3Url}">


<script th:inline="javascript">

    const errorMessage = /*[[${errorMessage}]]*/ null;
    if (errorMessage) {
        alert(errorMessage);
    }

    document.addEventListener("DOMContentLoaded", function () {
        // 1. 수량 조절 영역의 부모 요소를 찾습니다.
        const quantityContainer = document.querySelector(".quantity-wrapper");
        if (!quantityContainer) return;

        // 2. 부모 요소에 클릭 이벤트를 걸어 내부 버튼들을 감지합니다.
        quantityContainer.addEventListener("click", function (e) {
            const input = quantityContainer.querySelector("input[name='quantity']");
            let currentQuantity = parseInt(input.value) || 1;

            // 클릭된 요소의 텍스트로 + 인지 - 인지 구별합니다.
            if (e.target.textContent === "+") {
                input.value = currentQuantity + 1;
            } else if (e.target.textContent === "-") {
                // 수량이 1 미만으로 내려가지 않도록 방어 조건을 겁니다.
                if (currentQuantity > 1) {
                    input.value = currentQuantity - 1;
                }
            }
        });
    });

    async function addCart(productId) {
        const countInput = document.getElementById('quantity');
        const count = parseInt(countInput.value, 10);

        const token = document.querySelector("meta[name='_csrf']")?.getAttribute("content");
        const header = document.querySelector("meta[name='_csrf_header']")?.getAttribute("content");

        const paramData = {
            productId: productId,
            itemQuantity: count
        };

        try {
            const response = await fetch('/carts/create', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'X-Requested-With': 'XMLHttpRequest',
                    ...(header && token ? { [header]: token } : {})
                },
                body: JSON.stringify(paramData)
            });

            if (response.status === 401) {
                const errorData = await response.json();
                confirm(errorData.message);
                return;
            }

            if (response.ok) {
                const successMsg = await response.text();

                if (confirm(successMsg + "\n장바구니로 이동하시겠습니까?")) {
                    location.href = "/carts"
                }

            } else {
                const errorData = await response.json();
                alert(errorData.message);
            }
        } catch (error) {
            console.error("통신 에러:", error);
            alert("네트워크 오류가 발생했습니다. 잠시 후 다시 시도해 주세요.");
        }
    }
</script>
</body>
</html>
