<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org" xmlns:sec="http://www.thymeleaf.org/extras/spring-security">
<head>
    <meta charset="UTF-8">
    <title>상품 목록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<h1 class="title text-center mb-3 mt-5">Shopping Mall</h1>

<div sec:authorize="isAnonymous()" class="d-flex justify-content-end border-bottom border-3 pb-2 mb-3">
    <a class="text-decoration-none text-reset me-3" href="/users/signin">로그인</a>
    <a class="text-decoration-none text-reset me-5" href="/users/signup">회원 가입</a>
</div>

<div sec:authorize="isAuthenticated()" class="d-flex justify-content-between border-bottom border-3 pb-2 mb-3">
    <div class="ms-5">
        <a class="text-decoration-none text-reset me-3" href="/carts">장바구니</a>
        <a class="text-decoration-none text-reset" href="/orders">주문 내역</a>
    </div>
    <form class="me-5" th:action="@{/users/logout}" method="post">
        <button class="btn border-0 bg-transparent p-0" type="submit">로그아웃</button>
    </form>
</div>

<div class="container my-5">
    <div class="row row-cols-1 row-cols-md-3 g-4">
        <div class="col" th:each="product : ${page.content}">
            <div class="card h-100 shadow-sm click-card" th:data-product-id="${product.id}" style="cursor: pointer;">
                <img th:src="${product.imageUrl}" class="card-img-top object-fit-cover" alt="상품 이미지" style="height: 200px;">

                <div class="card-body">
                    <h5 class="card-title text-truncate" th:text="${product.name}">상품명</h5>
                    <p class="card-text text-danger fw-bold" th:text="${#numbers.formatInteger(product.price, 3, 'COMMA')} + '원'">0원</p>
                </div>
            </div>
        </div>
    </div>
</div>

<div th:if="${!page.isEmpty()}" class="d-flex justify-content-center mt-4"
     th:with="
        startNumber=${(page.number / 5) * 5 + 1},
        endNumber=${(startNumber + 4 < page.totalPages) ? startNumber + 4 : page.totalPages}
     ">

    <nav aria-label="Page navigation">
        <ul class="pagination">

            <li class="page-item" th:classappend="${page.first} ? 'disabled'">
                <a class="page-link" th:href="@{/products/list(page=0)}" aria-label="First">
                    <span aria-hidden="true">&laquo;&laquo;</span>
                </a>
            </li>

            <li class="page-item" th:classappend="${!page.hasPrevious()} ? 'disabled'">
                <a class="page-link" th:href="@{/products/list(page=${page.number - 1})}" aria-label="Previous">
                    <span aria-hidden="true">&laquo;</span>
                </a>
            </li>

            <li class="page-item"
                th:each="pageNo : ${#numbers.sequence(startNumber, endNumber)}"
                th:classappend="${pageNo - 1 == page.number} ? 'active'">
                <a class="page-link"
                   th:href="@{/products/list(page=${pageNo - 1})}"
                   th:text="${pageNo}">1</a>
            </li>

            <li class="page-item" th:classappend="${!page.hasNext()} ? 'disabled'">
                <a class="page-link" th:href="@{/products/list(page=${page.number + 1})}" aria-label="Next">
                    <span aria-hidden="true">&raquo;</span>
                </a>
            </li>

            <li class="page-item" th:classappend="${page.last} ? 'disabled'">
                <a class="page-link" th:href="@{/products/list(page=${page.totalPages - 1})}" aria-label="Last">
                    <span aria-hidden="true">&raquo;&raquo;</span>
                </a>
            </li>

        </ul>
    </nav>
</div>

<script>
    document.querySelectorAll('.click-card').forEach(card => {
    card.addEventListener('click', (event) => {
        const productId = event.currentTarget.dataset.productId;
        window.location.href = `/products/${productId}`;
        });
    });
</script>

</body>
</html>
