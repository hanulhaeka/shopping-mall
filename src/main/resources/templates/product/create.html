<!DOCTYPE html>
<html lang="en" xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>상품 등록</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
</head>
<body>
<div>
    <h1 class="title text-center mb-3 mt-5">Shopping Mall</h1>
    <div class="d-flex justify-content-between border-bottom border-3 pb-2 mb-3">
        <div class="ms-3">
            <a class="text-decoration-none text-reset me-1" href="/products/create">상품 등록</a>
            <a class="text-decoration-none text-reset" href="/products/admin/list">상품 목록</a>
        </div>
        <form th:action="@{/users/logout}" method="post">
            <button class="btn border-0 bg-transparent p-0" type="submit">로그아웃</button>
        </form>
    </div>
    <div class="d-flex flex-column justify-content-center align-items-center">
        <form class="w-50" th:action="@{/products/create}" th:object="${productCreateDto}" method="post" enctype="multipart/form-data">
            <h2 class="mb-3">상품 등록</h2>

            <div class="mb-3">
                <label class="form-label text-start w-100 mb-1" for="name">상품명 (필수)</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('name')}? 'is-invalid'" type="text" id="name" th:field="*{name}">
                <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('name')}" th:errors="*{name}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label text-start w-100 mb-1" for="price">가격 (필수)</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('price')}? 'is-invalid'" type="text" id="price" th:field="*{price}">
                <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('price')}" th:errors="*{price}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label text-start w-100 mb-1" for="stock">재고 (필수)</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('stock')}? 'is-invalid'" type="text" id="stock" th:field="*{stock}">
                <div class="text-start invalid-feedback" th:if="${#fields.hasErrors('stock')}" th:errors="*{stock}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label text-start w-100 mb-1"  for="imageHead">상품 대표 이미지 (필수)</label>
                <input class="form-control" th:classappend="${#fields.hasErrors('imageHead')}? 'is-invalid'" type="file" id="imageHead" name="imageHead">
                <div class="invalid-feedback" th:if="${#fields.hasErrors('imageHead')}" th:errors="*{imageHead}"></div>
            </div>

            <div class="mb-3">
                <label class="form-label text-start w-100 mb-1"  for="image1">상품 설명 이미지 1</label>
                <input class="form-control" type="file" id="image1" name="image1">
            </div>

            <div class="mb-3">
                <label class="form-label text-start w-100 mb-1"  for="image2">상품 설명 이미지 2</label>
                <input class="form-control" type="file" id="image2" name="image2">
            </div>

            <div class="mb-3">
                <label class="form-label text-start w-100 mb-1"  for="image3">상품 설명 이미지 3</label>
                <input class="form-control" type="file" id="image3" name="image3">
            </div>

            <div class="text-center mt-4">
                <button class="btn btn-success w-25" type="submit">등록</button>
            </div>
        </form>
    </div>
</div>
</body>
</html>
